# settings.yaml — Main configuration for the AI-powered Lazygit commands
#
# Edit this file to customize AI prompts, model lists, and provider settings.
# Provider selection at runtime is interactive (fzf) and persisted in config.state.yaml.
#
# Dependencies: yq (brew install yq)

# ─── AI Gateway ───────────────────────────────────────────────────────────────

ai:
  # Default provider shown pre-selected in the runtime picker: cursor | copilot | codex
  provider: copilot
  # Primary model — leave empty for provider default
  model: ""
  # Fallback model if primary fails — leave empty for no fallback
  fallback_model: ""
  # Number of retry attempts on failure (per model)
  max_retries: 2
  # Request timeout in seconds
  timeout: 60

# ─── Provider-specific Settings ───────────────────────────────────────────────

providers:
  cursor:
    # Path to Cursor agent binary (empty = auto-detect from PATH)
    bin: ""
    # Agent mode: ask (read-only Q&A) | plan (read-only planning)
    mode: ask
    # Comma-separated model list shown in the fzf model selector.
    # Leave empty to use the built-in defaults.
    models: "gpt-4o-mini (low — fast and economical),gpt-4o (medium — balanced),gpt-4.1 (medium — balanced),claude-sonnet-4-5 (medium — strong reasoning),gemini-2.5-pro (medium — multimodal),claude-4-5 (medium-high — latest sonnet),claude-opus-4 (high — premium quality),o3 (high — deep reasoning)"

  copilot:
    # Path to Copilot CLI binary (empty = auto-detect from PATH)
    bin: ""
    # Comma-separated model list shown in the fzf model selector.
    # Leave empty to use the built-in defaults.
    models: "gemini-3.1-pro-preview (medium — fast and capable),claude-sonnet-4.5 (medium — balanced quality),claude-sonnet-4.6 (medium-high — latest sonnet),gpt-5.3-codex (high — advanced coding),claude-opus-4.6 (high — premium quality)"

  codex:
    # Path to OpenAI Codex CLI binary (empty = auto-detect from PATH)
    bin: ""
    # Comma-separated model list shown in the fzf model selector.
    # Leave empty to use the built-in defaults.
    models: "gpt-5.6-terra (medium — balanced coding),gpt-5.6-luna (low — fast and economical),gpt-5.5 (high — complex coding and research)"

# ─── Azure DevOps ─────────────────────────────────────────────────────────────

azure_devops:
  # Keep empty to avoid storing credentials in this tracked file.
  # Use AZURE_DEVOPS_PAT or 'az login' for Azure DevOps remotes.
  pat: ""

# ─── Prompts ──────────────────────────────────────────────────────────────────
#
# Available placeholders:
#   __DIFF__               staged diff (commit/branch) or PR diff
#   __CONTEXT__            optional user-provided context
#   __FILES__              list of changed files (branch only)
#   __STATS__              diff stats summary (branch only)
#   __ANALYSIS_NAME__      name of the current analysis (e.g. "Security")
#   __PR_TITLE__           PR title
#   __PR_AUTHOR__          PR author login
#   __PR_BODY__            PR description
#   __PR_DIFF__            PR diff (first 400 lines)
#   __EXISTING_COMMENTS__  existing PR comments (prevents duplicate reports)
#   __INSTRUCTIONS__       specific instructions for the analysis type
#   __PASS1_RESULT__       Pass 1 findings (used in Pass 2)
#   __COMBINED_ISSUES__    deduplicated issues from passes 1+2 (used in Pass 3)
#   __ISSUE__              a single issue found during analysis
#   __SNIPPET__            relevant code snippet from the diff
#   __FILENAME__           filename where the issue is located
#   __COMMENT_LANG__       language for the comment (e.g. "Brazilian Portuguese")

prompts:

  # ─── Commit message ──────────────────────────────────────────────────────────

  commit: |
    Analyze the following DIFF and generate a commit message.

    ### START OF DIFF ###
    __DIFF__
    ### END OF DIFF ###

    __CONTEXT__

    INSTRUCTIONS:
    Generate a Pull Request-style commit message based on the DIFF above.

    STRICT STRUCTURE:
    1. Single-line title (max 30 chars).
    2. A blank line.
    3. Detailed overview paragraph (3-4 sentences) explaining 'what' and 'why'.
    4. Section: **<Category 1>**:
       - Bullet points for technical 'how' using `inline code`.
    5. Section: **<Category 2>**:
       - Bullet points for logic details.

    RULES:
    - Start directly with the title. No preamble ('Here is...', 'Sure', etc).
    - Do not try to complete or finish the code in the diff.
    - Never use em dashes (—) anywhere in the output.
    - Do not include any Co-authored-by lines.
    - Do not use emojis or special icons anywhere in the output.
    - Output ONLY the commit message.

  # ─── Branch name ─────────────────────────────────────────────────────────────

  branch: |
    As a Senior Developer, categorize these git changes and suggest a branch name.

    FILES:
    __FILES__

    STATS:
    __STATS__

    DIFF SNIPPET:
    __DIFF__

    __CONTEXT__

    LANGUAGE REQUIREMENT:
    - MUST use ONLY English for the branch name.

    DECISION LOGIC:
    1. Existing logic corrected, replaced, or adjusted → fix/
    2. New files or modules added → feat/
    3. Only config, deps, docker, ci, build files changed → chore/
    4. Code structure changes but behavior unchanged → refactor/
    5. Only markdown or comments → docs/

    RULES:
    - Use kebab-case. Be specific.
    - No emojis. No em dashes (—).
    - Output ONLY the branch name. No explanations.

  # ─── PR analysis — Pass 1 (initial analysis) ─────────────────────────────────

  analysis_pass1: |
    You are a senior software engineer performing a focused code review.

    Analyze the diff below ONLY for: __ANALYSIS_NAME__

    PR TITLE: __PR_TITLE__
    PR AUTHOR: __PR_AUTHOR__
    PR DESCRIPTION:
    __PR_BODY__

    __EXISTING_COMMENTS__

    CODE DIFF (up to 400 lines):
    __PR_DIFF__

    FOCUS:
    __INSTRUCTIONS__

    STRICT RULE ON COMMENTS: Do NOT report missing comments as issues. Never suggest
    adding inline comments, explanatory comments, or any kind of comment to the code.
    The only exception: if the project already uses official documentation comments
    (JSDoc, TSDoc, etc.) in the diffed files AND the changed code is missing a
    documentation comment that follows that exact same format. In all other cases,
    treat absent comments as acceptable and ignore them entirely.

    YOUR RESPONSE MUST START WITH ONE OF THESE TWO LINES — no other text before it:

      ANALYSIS_STATUS: OK
      (use this when there are no issues)

      ANALYSIS_STATUS: ISSUES_FOUND
      ISSUE: <one issue per line, include filename if visible>
      (use this when issues are found)

    EXAMPLE — no issues:
    ANALYSIS_STATUS: OK

    EXAMPLE — issues found:
    ANALYSIS_STATUS: ISSUES_FOUND
    ISSUE: Missing input validation on user endpoint (auth.service.ts)
    ISSUE: API key logged in debug mode (logger.ts)

    Begin your response now (never use em dashes — and no emojis):

  # ─── PR analysis — Pass 2 (second analysis with Pass 1 context) ──────────────

  analysis_pass2: |
    You are a senior software engineer performing a thorough second-pass code review.

    A first analysis for __ANALYSIS_NAME__ was already conducted on this PR. Your task
    is an independent analysis using the first-pass findings as context only — you are
    not constrained by them. You may confirm existing findings, discard false positives,
    or identify additional issues the first pass missed.

    PR TITLE: __PR_TITLE__
    PR AUTHOR: __PR_AUTHOR__
    PR DESCRIPTION:
    __PR_BODY__

    __EXISTING_COMMENTS__

    CODE DIFF (up to 400 lines):
    __PR_DIFF__

    FOCUS:
    __INSTRUCTIONS__

    STRICT RULE ON COMMENTS: Do NOT report missing comments as issues. Never suggest
    adding inline comments, explanatory comments, or any kind of comment to the code.
    The only exception: if the project already uses official documentation comments
    (JSDoc, TSDoc, etc.) in the diffed files AND the changed code is missing a
    documentation comment that follows that exact same format. In all other cases,
    treat absent comments as acceptable and ignore them entirely.

    FIRST PASS FINDINGS:
    __PASS1_RESULT__

    YOUR RESPONSE MUST START WITH ONE OF THESE TWO LINES — no other text before it:

      ANALYSIS_STATUS: OK
      (use this when there are no real issues)

      ANALYSIS_STATUS: ISSUES_FOUND
      ISSUE: <one issue per line, include filename if visible>
      (use this when issues are found)

    EXAMPLE — no issues:
    ANALYSIS_STATUS: OK

    EXAMPLE — issues found:
    ANALYSIS_STATUS: ISSUES_FOUND
    ISSUE: Missing input validation on user endpoint (auth.service.ts)
    ISSUE: API key logged in debug mode (logger.ts)

    Begin your response now (never use em dashes — and no emojis):

  # ─── PR analysis — Pass 3 (validation of combined findings) ──────────────────

  analysis_pass3: |
    You are a senior software engineer validating code review findings.

    Two independent analyses for __ANALYSIS_NAME__ were performed. The combined list of
    unique issues found across both passes is provided below. Your task: validate each
    issue against the actual diff and confirm whether it is a real finding or a false
    positive. You must justify your decision with evidence from the code.

    PR TITLE: __PR_TITLE__
    PR AUTHOR: __PR_AUTHOR__
    PR DESCRIPTION:
    __PR_BODY__

    __EXISTING_COMMENTS__

    CODE DIFF (up to 400 lines):
    __PR_DIFF__

    FOCUS:
    __INSTRUCTIONS__

    STRICT RULE ON COMMENTS: Do NOT report missing comments as issues. Never suggest
    adding inline comments, explanatory comments, or any kind of comment to the code.
    The only exception: if the project already uses official documentation comments
    (JSDoc, TSDoc, etc.) in the diffed files AND the changed code is missing a
    documentation comment that follows that exact same format. In all other cases,
    treat absent comments as acceptable and ignore them entirely.

    COMBINED ISSUES FROM PREVIOUS ANALYSES (may contain false positives):
    __COMBINED_ISSUES__

    Keep only issues you can directly support with evidence from the diff above.
    Discard anything speculative or not clearly visible in the code.

    YOUR RESPONSE MUST START WITH ONE OF THESE TWO LINES — no other text before it:

      ANALYSIS_STATUS: OK
      (use this when no issues survive validation)

      ANALYSIS_STATUS: ISSUES_FOUND
      ISSUE: <only confirmed issues, include filename if visible>
      (use this when at least one issue is confirmed)

    Begin your response now (never use em dashes — and no emojis):

  # ─── PR comment generation ───────────────────────────────────────────────────

  comment: |
    You are a developer writing a code review comment on GitHub.

    ISSUE:
    __ISSUE__

    RELEVANT CODE FROM THE DIFF (file: __FILENAME__):
    __SNIPPET__

    PR context: "__PR_TITLE__"

    TASK:
    1. Identify the exact line in the diff snippet above where this issue is located.
    2. Write a natural code review comment about the issue.

    YOUR RESPONSE MUST follow this exact format — two parts separated by a blank line:

    LOCATION: <file_path>:<line_number>

    <comment text here>

    Rules for LOCATION:
    - Use the file path exactly as shown in the diff (e.g. src/user.repository.ts)
    - Use the line number of the specific problematic line in the new file version
    - If the exact line cannot be determined, write: LOCATION: unknown

    Rules for the comment:
    - Language: __COMMENT_LANG__
    - Use correct, standard grammar — no informal contractions or slang
    - Sound like a human reviewer: direct, clear, and professional
    - No markdown headers, no bullet points, no titles
    - No formal openers (Hi, Hello, I noticed)
    - No closing remarks or sign-offs
    - 1 to 3 sentences maximum
    - State the problem clearly and optionally hint at the fix
    - Never use em dashes (—)
    - Do not use emojis or special icons
    - Do NOT include terminal commands, shell scripts, grep invocations, or command-line examples
    - Do NOT include tool output, file search results, or verification steps
    - Do NOT use code blocks, backtick fences, or any formatted output blocks
    - Output ONLY the plain comment text — nothing else

  # ─── Per-analysis instructions ───────────────────────────────────────────────

  instructions:

    architecture: |
      Check for: violations of separation of concerns, improper coupling between layers, violation of SOLID principles, architectural pattern inconsistencies with the rest of the codebase shown in the diff.

    security: |
      Check for: exposed secrets or credentials in code, SQL/NoSQL injection risks, unsanitized user inputs, insecure dependencies usage, authentication/authorization bypasses, sensitive data logged to console, insecure configurations or hardcoded values.

    code_quality: |
      Check for: code duplication, overly complex functions, misleading or poor naming, missing error handling for critical paths, dead code, deeply nested logic that should be refactored, violations of DRY/KISS principles.

    test_coverage: |
      Check for: new functionality without corresponding tests, missing edge case coverage for changed logic, no tests covering critical business logic changes, poor test quality such as testing implementation instead of behavior.

    performance: |
      Check for: N+1 query patterns, unnecessary loops inside loops, missing database indexes implied by queries, blocking synchronous operations that should be async, inefficient algorithms on large datasets, unnecessary re-renders or re-computations.

    spelling: |
      First, automatically detect the language of the text (Portuguese, English, Spanish, etc). Then check for: spelling mistakes and typos in comments, documentation, commit messages, variable names, function names, and string literals. Missing or incorrect accents in Portuguese/Spanish text (e.g., 'entao' should be 'então', 'voce' should be 'você'). Grammatical errors in natural language text. Inconsistent language usage (mixing languages inappropriately). Report the detected language and any spelling/grammar issues found.

    bugs: |
      Check for: potential null pointer dereferences or undefined access, off-by-one errors in loops or array indexing, race conditions or concurrency issues, incorrect conditional logic or missing edge cases, resource leaks (unclosed files, connections, streams), infinite loops or recursion without base case, incorrect error handling that swallows exceptions, logic errors that produce wrong results, type mismatches or incorrect type conversions, incorrect API usage or parameter passing.

    fix_validation: |
      Review the existing PR comments that request fixes or changes. For each comment that asks for a fix, correction, or improvement, check if the current diff addresses that request. Report ONLY comments that have been properly addressed and fixed. For each fixed comment, use this EXACT format:

      ISSUE: FIXED - [exact text from the original comment] Evidence: [what changed in the diff]

      Focus on comments containing keywords like 'fix', 'change', 'update', 'incorrect', 'should', 'needs', 'please', 'TODO', 'FIXME'. Only report comments as FIXED if you have clear evidence in the diff that the requested change was implemented. If a comment is still pending or partially addressed, do NOT report it as an issue (use ANALYSIS_STATUS: OK with no issues).
